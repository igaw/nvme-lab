# nvme-cli#3309 with nvme-cli 3: nvme-discoverd connects the subsystem,
# the mount has _netdev (#4332 orders the disconnect after its unmount).
# nvme-fabrics is loaded at boot (/etc/modules-load.d), as a user does
# when nvme-discoverd's connection units fail (shutdown-discoverd).
name = "shutdown with an NVMe/TCP mount (nofail,_netdev), nvme-discoverd, nvme-fabrics loaded at boot"
tags = ["shutdown", "guest", "nvme-cli-3", "discoverd"]

[guest]
connect = "discoverd"
fstab = "nofail,_netdev"
modules_load = true
