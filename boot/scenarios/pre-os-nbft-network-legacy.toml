# The pre-OS model's NBFT boot with network-legacy: the ip= of the HFI
# names its interface by the MAC address, so the interface keeps its name
# and has no nbftN at all (dracut, "use the MAC address of an NBFT
# interface with network-legacy"). nvme connects through eth0 and records
# it for the OS environment.
name = "pre-OS NBFT boot with network-legacy, no rename"
tags = ["pre-os", "nbft", "nvme-cli-3", "network-legacy"]

[boot]
nbft_ssns = ["extra,nonboot"]
network = "legacy"

[expect]
result = "pass"
controllers = ["root", "extra"]
owners = { root = "pre-os", extra = "pre-os" }
host_iface = { root = "eth0", extra = "eth0" }
iface_names = { nbft0 = "" }
