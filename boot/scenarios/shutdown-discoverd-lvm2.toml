# nvme-cli#3309 with lvm2 and nvme-discoverd: lvm2-monitor.service
# stops after the network and scans the namespace. nvme-discoverd's
# connection unit disconnects after the _netdev unmount and before the
# network goes down (#4332), so lvm2 has nothing left to block on, as
# with the unit fixes for the autoconnect path (shutdown-lvm2).
name = "shutdown with an NVMe/TCP mount (nofail,_netdev), nvme-discoverd and lvm2"
tags = ["shutdown", "guest", "lvm2", "nvme-cli-3", "discoverd"]

[xfail_on]
"v3.2" = "nothing loads nvme-fabrics for nvme-discoverd's connection units: no mount (fixed by modprobe@nvme_fabrics in nvme-discoverd.service, nvme-cli#4405)"
"suite-master" = "nothing loads nvme-fabrics for nvme-discoverd's connection units: no mount (fixed by modprobe@nvme_fabrics in nvme-discoverd.service, nvme-cli#4405)"

[guest]
connect = "discoverd"
fstab = "nofail,_netdev"
lvm2 = true
uptime = 60
