# The pre-OS model's NBFT boot over VLAN 10 with networkd: the HFI keeps
# its name, nbft0 is an alternative name of it, and networkd makes the
# VLAN interface nbft0.10 on it (vlan=nbft0.10:nbft0 matches the
# alternative name). nvme connects through nbft0.10.
name = "pre-OS NBFT boot over a VLAN, networkd, no rename"
tags = ["pre-os", "nbft", "nvme-cli-3", "vlan"]


[boot]
nbft = true
vlan = 10

[expect]
result = "pass"
controllers = ["root"]
owners = { root = "pre-os" }
host_iface = { root = "nbft0.10" }
iface_names = { nbft0 = "eth0" }
