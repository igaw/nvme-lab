# nvme-cli#3309: a data file system on NVMe/TCP in fstab with nofail
# only, nvme-cli's units as installed. nvmf-autoconnect.service is
# ordered after network-online.target but doesn't want it, and without
# a _netdev mount nothing else does: it races ifupdown's
# networking.service. When it loses (most runs), it fails with -101 and
# nothing is mounted; when it wins, the shutdown hangs as in
# shutdown-nofail-online.
name = "shutdown with an NVMe/TCP mount (nofail), autoconnect"
tags = ["shutdown", "guest"]
xfail = "nvmf-autoconnect.service doesn't want network-online.target: 'failed to connect socket: -101' at boot, no mount (2.8-3.2, Debian 2.13); when it connects, the shutdown hangs (master) (nvme-cli#3309)"

[guest]
connect = "autoconnect"
fstab = "nofail"
