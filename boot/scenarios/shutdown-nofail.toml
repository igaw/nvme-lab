# nvme-cli#3309: a data file system on NVMe/TCP in fstab with nofail
# only, nvme-cli's units as installed. nvmf-autoconnect.service is
# ordered after network-online.target but doesn't want it, and without
# a _netdev mount nothing else does: it races ifupdown's
# networking.service. When it loses (most runs), it fails with -101 and
# nothing is mounted; when it wins, the shutdown hangs as in
# shutdown-nofail-online.
name = "shutdown with an NVMe/TCP mount (nofail), autoconnect"
tags = ["shutdown", "guest"]
xfail = "a mount on NVMe-oF without _netdev is not supported: nothing orders it against the network or the disconnect. Up to 3.2 and with Debian 2.13, nvmf-autoconnect.service doesn't want network-online.target: 'failed to connect socket: -101', no mount; when it connects (master), the shutdown hangs. With the unit fixes it connects, and the disconnect runs before the unmount: 'no available path - failing I/O' (nvme-cli#3309)"
# A race: now and then the unmount comes before the disconnect, and the case passes.
xfail_strict = false

[guest]
connect = "autoconnect"
fstab = "nofail"
