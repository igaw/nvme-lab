# nvme-cli#3309: the same with _netdev, which orders the unmount before
# network-online.target stops.
name = "shutdown with an NVMe/TCP mount (nofail,_netdev), autoconnect"
tags = ["shutdown", "guest"]

# A race on the releases: they leave the controller connected.
xfail_strict = false

[xfail_on]
"v2.8" = "the controller stays connected when ifupdown takes the network down, after the unmount; systemd-shutdown's sync then can hang on it, keep-alive timeouts, no power-off (2 of 90 runs overnight 2026-11-10, master and 2.16; nvme-cli#3309). Fixed by nvmf-autoconnect's ExecStop, nvme-cli#4405"
"v2.13" = "the controller stays connected when ifupdown takes the network down, after the unmount; systemd-shutdown's sync then can hang on it, keep-alive timeouts, no power-off (2 of 90 runs overnight 2026-11-10, master and 2.16; nvme-cli#3309). Fixed by nvmf-autoconnect's ExecStop, nvme-cli#4405"
"v2.16" = "the controller stays connected when ifupdown takes the network down, after the unmount; systemd-shutdown's sync then can hang on it, keep-alive timeouts, no power-off (2 of 90 runs overnight 2026-11-10, master and 2.16; nvme-cli#3309). Fixed by nvmf-autoconnect's ExecStop, nvme-cli#4405"
"v3.2" = "the controller stays connected when ifupdown takes the network down, after the unmount; systemd-shutdown's sync then can hang on it, keep-alive timeouts, no power-off (2 of 90 runs overnight 2026-11-10, master and 2.16; nvme-cli#3309). Fixed by nvmf-autoconnect's ExecStop, nvme-cli#4405"
"package" = "the controller stays connected when ifupdown takes the network down, after the unmount; systemd-shutdown's sync then can hang on it, keep-alive timeouts, no power-off (2 of 90 runs overnight 2026-11-10, master and 2.16; nvme-cli#3309). Fixed by nvmf-autoconnect's ExecStop, nvme-cli#4405"
"suite-master" = "the controller stays connected when ifupdown takes the network down, after the unmount; systemd-shutdown's sync then can hang on it, keep-alive timeouts, no power-off (2 of 90 runs overnight 2026-11-10, master and 2.16; nvme-cli#3309). Fixed by nvmf-autoconnect's ExecStop, nvme-cli#4405"

[guest]
connect = "autoconnect"
fstab = "nofail,_netdev"
