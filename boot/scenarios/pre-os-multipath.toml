# The pre-OS model with a multipath NBFT root: every path of the root and
# the non-bootable subsystem get the owner pre-os and ctrl_loss_tmo=-1.
# The NBFT is still there after switch-root, so nothing is recorded in
# pre-os.conf.
name = "pre-OS owners of a multipath root"
tags = ["pre-os", "nbft", "multipath", "nvme-cli-3"]

[boot]
nbft_ssns = ["{root2}/{root_nqn}", "extra,nonboot"]

[expect]
result = "pass"
controllers = ["root", "extra"]
paths = { root = 2 }
owners = { root = "pre-os", extra = "pre-os" }
ctrl_loss_tmo = { root = "off", extra = "off" }
pre_os_conf = 0
